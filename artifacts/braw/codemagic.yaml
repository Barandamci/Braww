workflows:
  android-apk:
    name: Braw Android APK
    max_build_duration: 60
    environment:
      node: 20.18.0
      java: 17
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm@9

      - name: Install dependencies
        script: |
          cd artifacts/braw
          pnpm install --no-frozen-lockfile

      - name: Expo Prebuild (Android)
        script: |
          cd artifacts/braw
          npx expo prebuild --platform android --clean

      - name: Build Android APK
        script: |
          cd artifacts/braw/android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - artifacts/braw/android/app/build/outputs/**/*.apk
      - artifacts/braw/android/app/build/outputs/**/*.aab

    publishing:
      email:
        recipients:
          - barandamci@icloud.com
        notify:
          success: true
          failure: true
