workflows:
  android-release:
    name: Android Release (APK)
    max_build_duration: 60
    environment:
      node: 22.11.0
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          corepack disable
          npm install -g pnpm@9 --force
          pnpm install --no-frozen-lockfile

      - name: Build Android APK
        script: |
          cd artifacts/braw
          npx expo prebuild --platform android --clean --no-install
          echo "kotlinVersion=1.9.24" >> android/gradle.properties
          python3 fix-gradle.py
          cd android
          ./gradlew assembleRelease 2>&1 || true

    artifacts:
      - artifacts/braw/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - kuzenlervehal@gmail.com
        notify:
          success: true
          failure: true
