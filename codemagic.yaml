workflows:
  android-release:
    name: Android Release (APK)
    max_build_duration: 60
    environment:
      node: 20.18.0
      java: 17
    scripts:
      - name: Install pnpm
        script: |
          corepack disable
          npm install -g pnpm@9 --force
          pnpm --version

      - name: Install dependencies
        script: |
          pnpm install --no-frozen-lockfile

      - name: Expo Prebuild
        script: |
          cd artifacts/braw
          npx expo prebuild --platform android --clean --no-install

      - name: Fix Gradle properties
        script: |
          cd artifacts/braw/android
          echo "kotlinVersion=1.9.24" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.6-bin.zip\nnetworkTimeout=10000\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Build Android APK
        script: |
          cd artifacts/braw/android
          ./gradlew assembleRelease --warning-mode none --no-daemon

    artifacts:
      - artifacts/braw/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - barandamci@icloud.com
        notify:
          success: true
          failure: true
