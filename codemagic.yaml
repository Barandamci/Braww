workflows:
  android-release:
    name: Android Release (APK)
    max_build_duration: 60
    environment:
      node: 22.11.0
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          corepack disable
          npm install -g pnpm@9 --force
          pnpm install --no-frozen-lockfile

      - name: Build Android APK
        script: |
          cd artifacts/braw
          npx expo prebuild --platform android --clean --no-install
          echo "kotlinVersion=1.9.24" >> android/gradle.properties
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          python3 fix-gradle.py
          cd android
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          ./gradlew assembleRelease --warning-mode none

    artifacts:
      - artifacts/braw/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - kuzenlervehal@gmail.com
        notify:
          success: true
          failure: true
