workflows:
  android-release:
    name: Android Release (APK)
    max_build_duration: 60
    environment:
      node: 22.11.0
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          corepack disable
          npm install -g pnpm@9 --force
          cd artifacts/braw
          pnpm install --no-frozen-lockfile

      - name: Build Android APK
        script: |
          cd artifacts/braw
          npx expo prebuild --platform android --clean
          cd android
          ./gradlew assembleRelease --warning-mode all --info 2>&1 | grep -A 5 "FAILED\|Exception\|Error" | head -80

    artifacts:
      - artifacts/braw/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - kuzenlervehal@gmail.com
        notify:
          success: true
          failure: true
