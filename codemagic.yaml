workflows:
  android-release:
    name: Android Release (APK)
    max_build_duration: 60
    environment:
      node: 22.11.0
      java: 17
    scripts:
      - name: Install pnpm
        script: |
          corepack disable
          npm install -g pnpm@9 --force
          pnpm --version

      - name: Install dependencies
        script: |
          pnpm install --no-frozen-lockfile

      - name: Patch expo-modules-autolinking for Gradle 8.x
        script: |
          AUTOLINKING_SRC=$(find /Users/builder/clone/node_modules -path "*/expo-modules-autolinking/android/expo-gradle-plugin/expo-autolinking-settings-plugin/src/main/kotlin" -type d 2>/dev/null | head -1)
          if [ -n "$AUTOLINKING_SRC" ]; then
            SM_FILE="$AUTOLINKING_SRC/expo/modules/plugin/SettingsManager.kt"
            if [ -f "$SM_FILE" ]; then
              sed -i '/import org.gradle.internal.extensions.core.extra/d' "$SM_FILE"
              sed -i 's/project\.extra\.set(/project.extensions.extraProperties.set(/g' "$SM_FILE"
              echo "Autolinking patch applied"
            fi
          fi

      - name: Expo Prebuild
        script: |
          cd artifacts/braw
          npx expo prebuild --platform android --clean --no-install

      - name: Patch expo-modules-core compose compiler
        script: |
          find /Users/builder/clone/node_modules/expo-modules-core -name "build.gradle" -o -name "build.gradle.kts" | while read f; do
            sed -i 's/kotlin-compose-compiler-plugin-embeddable:1\.9\.24/kotlin-compose-compiler-plugin-embeddable:2.0.21/g' "$f"
            sed -i 's/compose_compiler_version = "1\.9\.24"/compose_compiler_version = "2.0.21"/g' "$f"
          done
          echo "Compose compiler patch applied"

      - name: Fix Gradle & Kotlin versions
        script: |
          cd artifacts/braw/android
          sed -i '/kotlinVersion/d' gradle.properties
          echo "kotlinVersion=2.0.21" >> gradle.properties
          echo "suppressKotlinVersionCompatibilityCheck=2.0.21" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-8.10-bin.zip\nnetworkTimeout=10000\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Build Android APK
        script: |
          cd artifacts/braw/android
          ./gradlew assembleRelease --warning-mode none --no-daemon

    artifacts:
      - artifacts/braw/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - barandamci@icloud.com
        notify:
          success: true
          failure: true
