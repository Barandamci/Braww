workflows:
  android-release:
    name: Android Release (APK)
    max_build_duration: 60
    environment:
      node: 22.11.0
      java: 17
    scripts:
      - name: Install pnpm
        script: |
          corepack disable
          npm install -g pnpm@9 --force
          pnpm --version

      - name: Install dependencies
        script: |
          pnpm install --no-frozen-lockfile

      - name: Expo Prebuild
        script: |
          cd artifacts/braw
          npx expo prebuild --platform android --clean --no-install

      - name: Fix Gradle & Kotlin versions
        script: |
          cd artifacts/braw/android

          # Kotlin 1.9.0 — expo-autolinking@2.1.x ile uyumlu
          sed -i '/kotlinVersion/d' gradle.properties
          echo "kotlinVersion=1.9.0" >> gradle.properties

          # AGP uyarısını kapat
          echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties

          # New arch sorun çıkarıyorsa kapat
          sed -i 's/newArchEnabled=true/newArchEnabled=false/' gradle.properties

          # Gradle 8.3 — expo-autolinking ile uyumlu, 8.6 değil
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-bin.zip\nnetworkTimeout=10000\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

      - name: Build Android APK
        script: |
          cd artifacts/braw/android
          ./gradlew assembleRelease --warning-mode none --no-daemon

    artifacts:
      - artifacts/braw/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - barandamci@icloud.com
        notify:
          success: true
          failure: true
